AWSTemplateFormatVersion: "2010-09-09"
Description: "FinOps AI - Secrets Manager for AI configuration"

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, stg, prod]
    Default: prod

  BedrockRegion:
    Type: String
    Default: ap-south-1
    Description: AWS region where Bedrock models are available

  DefaultModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Default Bedrock model ID for cost chat

  SummaryModelId:
    Type: String
    Default: anthropic.claude-3-sonnet-20240229-v1:0
    Description: Bedrock model ID for monthly report summaries

Resources:

  # ==================== AI Config Secret ====================
  FinOpsAISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "finops/${Environment}/ai-config"
      Description: FinOps AI/ML configuration — Bedrock model IDs and settings
      SecretString: !Sub |
        {
          "bedrock_region": "${BedrockRegion}",
          "default_model_id": "${DefaultModelId}",
          "summary_model_id": "${SummaryModelId}",
          "max_tokens": 1024,
          "temperature": 0.1,
          "top_p": 0.9,
          "chat_system_prompt": "You are a FinOps AI assistant. You help users understand their AWS and Azure cloud costs. Answer questions based only on the cost data provided. Be concise, specific, and use numbers. Format currency in INR with commas.",
          "summary_system_prompt": "You are a FinOps reporting assistant. Generate a concise executive summary of cloud cost data. Highlight top cost drivers, month-over-month changes, and actionable recommendations. Use bullet points."
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: FinOps-AI

Outputs:
  AISecretArn:
    Value: !Ref FinOpsAISecret
    Export:
      Name: !Sub "${AWS::StackName}-AISecretArn"

  AISecretName:
    Value: !Sub "finops/${Environment}/ai-config"
    Export:
      Name: !Sub "${AWS::StackName}-AISecretName"
