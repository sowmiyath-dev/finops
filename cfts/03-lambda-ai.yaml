AWSTemplateFormatVersion: "2010-09-09"
Description: "FinOps AI - Lambda function for Bedrock cost chat and monthly summary"

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, stg, prod]
    Default: prod

  BedrockInvokeRoleArn:
    Type: String
    Description: ARN of the Bedrock invoke IAM role (from 01-iam stack)

  AISecretArn:
    Type: String
    Description: ARN of the AI config secret (from 02-secrets stack)

  DefaultModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0

  SummaryModelId:
    Type: String
    Default: anthropic.claude-3-sonnet-20240229-v1:0

  BedrockRegion:
    Type: String
    Default: ap-south-1

  LambdaTimeout:
    Type: Number
    Default: 60

  LambdaMemorySize:
    Type: Number
    Default: 512

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:

  # ==================== Cost Chat Lambda ====================
  CostChatLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cost-chat"
      Runtime: python3.11
      Handler: index.handler
      Role: !Ref BedrockInvokeRoleArn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          BEDROCK_REGION: !Ref BedrockRegion
          DEFAULT_MODEL_ID: !Ref DefaultModelId
          SUMMARY_MODEL_ID: !Ref SummaryModelId
          AI_SECRET_ARN: !Ref AISecretArn
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          bedrock = boto3.client("bedrock-runtime", region_name=os.environ["BEDROCK_REGION"])

          CHAT_SYSTEM = (
              "You are a FinOps AI assistant. Answer questions about cloud costs based only on "
              "the data provided. Be concise and specific. Format currency in INR with commas."
          )

          SUMMARY_SYSTEM = (
              "You are a FinOps reporting assistant. Generate a concise executive summary. "
              "Highlight top cost drivers, month-over-month changes, and actionable recommendations."
          )

          def invoke_claude(model_id, system_prompt, user_message, max_tokens=1024):
              body = {
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": max_tokens,
                  "temperature": 0.1,
                  "system": system_prompt,
                  "messages": [{"role": "user", "content": user_message}]
              }
              response = bedrock.invoke_model(
                  modelId=model_id,
                  body=json.dumps(body),
                  contentType="application/json",
                  accept="application/json"
              )
              result = json.loads(response["body"].read())
              return result["content"][0]["text"]

          def handler(event, context):
              action = event.get("action", "chat")
              cost_data = event.get("cost_data", {})
              question = event.get("question", "")
              model_id = os.environ["DEFAULT_MODEL_ID"]

              if action == "summary":
                  model_id = os.environ["SUMMARY_MODEL_ID"]
                  prompt = f"Generate a monthly cost summary report for this data:\n{json.dumps(cost_data, indent=2)}"
                  system = SUMMARY_SYSTEM
              else:
                  prompt = f"Cost data:\n{json.dumps(cost_data, indent=2)}\n\nQuestion: {question}"
                  system = CHAT_SYSTEM

              try:
                  answer = invoke_claude(model_id, system, prompt)
                  return {"statusCode": 200, "body": json.dumps({"answer": answer})}
              except Exception as e:
                  return {"statusCode": 500, "body": json.dumps({"error": str(e)})}

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: FinOps-AI

  CostChatLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CostChatLambda}"
      RetentionInDays: !If [IsProduction, 30, 7]

  # ==================== Lambda URL (no API Gateway needed — called directly from EC2 backend) ====================
  CostChatLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref CostChatLambda
      AuthType: AWS_IAM
      Cors:
        AllowOrigins:
          - "https://finoptix.novactech.in"
        AllowMethods: [POST]
        AllowHeaders:
          - content-type
          - x-amz-date
          - authorization
          - x-amz-security-token

  CostChatLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CostChatLambda
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: AWS_IAM

Outputs:
  CostChatLambdaArn:
    Value: !GetAtt CostChatLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CostChatLambdaArn"

  CostChatLambdaName:
    Value: !Ref CostChatLambda
    Export:
      Name: !Sub "${AWS::StackName}-CostChatLambdaName"

  CostChatLambdaUrl:
    Value: !GetAtt CostChatLambdaUrl.FunctionUrl
    Export:
      Name: !Sub "${AWS::StackName}-CostChatLambdaUrl"
